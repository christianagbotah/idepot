name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: idepot_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: idepot_legacy_staging
          MYSQL_USER: idepot_migration
          MYSQL_PASSWORD: idepot_migration_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      IDEPOT_JWT_SECRET: ci-secret-0123456789abcdef-0123456789abcdef
      IDEPOT_MIGRATION_MYSQL_URL: mysql://idepot_migration:idepot_migration_ci@127.0.0.1:3306/idepot_legacy_staging
      IDEPOT_MIGRATION_PG_ADMIN_URL: postgresql://postgres:postgres_ci@127.0.0.1:5432/idepot_ci
      IDEPOT_MIGRATION_ARTIFACTS_DIR: ./migration-artifacts

    steps:
      - uses: actions/checkout@v4

      - name: Verify legacy-schema parity checker (66 tables, no drift)
        run: |
          python3 scripts/schema_diff.py
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          from schema_diff import norm_type, parse_index_lines

          assert norm_type('decimal', '15,2') != norm_type('decimal', '15,4'), 'decimal precision drift must be detected'
          assert norm_type('enum', "'Open','Closed'") != norm_type('enum', "'Open','Cancelled'"), 'enum member drift must be detected'
          first = parse_index_lines("KEY `Composite Index` (`item_id`,`customer_id`(50))", alter=False)
          second = parse_index_lines("UNIQUE KEY `Composite Index` (`item_id`,`customer_id`(50))", alter=False)
          assert first['Composite Index']['columns'] == 'item_id,customer_id(50)', 'composite/prefix index must be complete'
          assert first != second, 'index uniqueness drift must be detected'

          d = json.load(open('docs/migration/schema_drift.json'))
          assert d['table_count'] == {'old': 66, 'new': 66, 'common': 66}, d['table_count']
          assert not d['only_in_new'] and not d['only_in_old']
          for table, delta in d['tables'].items():
              assert not any(value for value in delta.values()), f'{table}: {delta}'
          print('LEGACY SCHEMA PARITY PASS: 66 tables, column/index/PK/autoincrement identical')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve + rebuild postinstall binaries (npm security default)
        run: |
          npm install-scripts approve esbuild || true
          npm install-scripts approve @embedded-postgres/linux-x64 || true
          npm install-scripts approve @swc/core || true
          npm rebuild esbuild @embedded-postgres/linux-x64 @swc/core

      - name: Lint (module boundaries enforced)
        run: npm run lint

      # Regression guard: deletes every generated dist/.next first, then
      # typechecks from SOURCE via tsconfig.typecheck.json path mappings —
      # proves the repo never depends on stale build output (PR #2 root cause).
      - name: Typecheck (clean — no stale dist allowed)
        run: npm run typecheck:clean

      - name: Build (topological)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (embedded PG + RLS + RBAC + coordinator + migration smoke)
        run: npm run test:integration

      - name: Apply migrations to CI PostgreSQL
        run: npx tsx infra/migrations/run.ts --url "$IDEPOT_MIGRATION_PG_ADMIN_URL"

      - name: Migration smoke (fixture dump → staging MySQL → legacy_raw → reconciliation.json)
        run: |
          npm run migration:smoke
          test -f migration-artifacts/reconciliation.json

      - name: Upload migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation
          path: migration-artifacts/

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: secret scanning must cover every commit, not just HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Secret scanning (gitleaks, pinned + checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --config .gitleaks.toml \
            --report-format sarif --report-path /tmp/gitleaks-report.sarif

      - name: Upload secret-scan report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: /tmp/gitleaks-report.sarif

      # Policy (docs/security/dependency-audit.md): runtime dependency chains
      # hard-fail on high/critical; dev-only chains hard-fail on critical and
      # highs are triaged to zero with a documented expiry.
      - name: Dependency audit — runtime chains (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit — all chains incl. dev (fail on critical)
        run: npm audit --audit-level=critical
