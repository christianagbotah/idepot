name: ci

on:
  push:
    branches: ['phase-1/**', 'phase-0/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: idepot_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: idepot_legacy_staging
          MYSQL_USER: idepot_migration
          MYSQL_PASSWORD: idepot_migration_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      IDEPOT_JWT_SECRET: ci-secret-0123456789abcdef-0123456789abcdef
      IDEPOT_MIGRATION_MYSQL_URL: mysql://idepot_migration:idepot_migration_ci@127.0.0.1:3306/idepot_legacy_staging
      IDEPOT_MIGRATION_PG_ADMIN_URL: postgresql://postgres:postgres_ci@127.0.0.1:5432/idepot_ci
      IDEPOT_MIGRATION_ARTIFACTS_DIR: ./migration-artifacts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve + rebuild postinstall binaries (npm security default)
        run: |
          npm install-scripts approve esbuild || true
          npm install-scripts approve @embedded-postgres/linux-x64 || true
          npm rebuild esbuild @embedded-postgres/linux-x64

      - name: Lint (module boundaries enforced)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (topological)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (embedded PG + RLS + RBAC + coordinator + migration smoke)
        run: npm run test:integration

      - name: Apply migrations to CI PostgreSQL
        run: npx tsx infra/migrations/run.ts --url "$IDEPOT_MIGRATION_PG_ADMIN_URL"

      - name: Migration smoke (fixture dump → staging MySQL → legacy_raw → reconciliation.json)
        run: |
          npm run migration:smoke
          test -f migration-artifacts/reconciliation.json

      - name: Upload migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation
          path: migration-artifacts/
